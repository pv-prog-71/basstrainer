 {const src=AC.createMediaElementSource(au),mk=t=>{const a=AC.createBiquadFilter(),b=AC.createBiquadFilter();a.type=b.type=t;a.frequency.value=b.frequency.value=250;a.Q.value=b.Q.value=.707;a.connect(b);return [a,b]},lo=mk("lowpass"),hi=mk("highpass");
  mG={lo:AC.createGain(),hi:AC.createGain()};src.connect(lo[0]);src.connect(hi[0]);lo[1].connect(mG.lo);hi[1].connect(mG.hi);mG.lo.connect(AC.destination);mG.hi.connect(AC.destination)}
